rule-providers:
  private-domains:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geosite/release/mihomo/private.mrs
    path: ./ruleset/geosite-private.mrs
    proxy: Ключики ;3
    interval: 2592000
  whitelist-domains:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geosite/release/mihomo/whitelist.mrs
    path: ./ruleset/geosite-whitelist.mrs
    proxy: Ключики ;3
    interval: 86400
  private-ips:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geoip/release/mihomo/private.mrs
    path: ./ruleset/geoip-private.mrs
    proxy: Ключики ;3
    interval: 2592000
  whitelist-ips:
    type: http
    behavior: ipcidr
    format: mrs
    url: https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geoip/release/mihomo/whitelist.mrs
    path: ./ruleset/geoip-whitelist.mrs
    proxy: Ключики ;3
    interval: 86400
  win-spy:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geosite/release/mihomo/win-spy.mrs
    path: ./ruleset/win-spy.mrs
    proxy: Ключики ;3
    interval: 86400
  category-ads:
    type: http
    behavior: domain
    format: mrs
    url: https://cdn.jsdelivr.net/gh/hydraponique/roscomvpn-geosite/release/mihomo/category-ads.mrs
    path: ./ruleset/category-ads.mrs
    proxy: Ключики ;3
    interval: 86400
rules:
  - RULE-SET,win-spy,REJECT-DROP
  - RULE-SET,category-ads,REJECT-DROP
  - RULE-SET,private-ips,DIRECT,no-resolve
  - RULE-SET,whitelist-ips,DIRECT,no-resolve
  - RULE-SET,private-domains,DIRECT
  - RULE-SET,whitelist-domains,DIRECT
  - MATCH,Ключики ;3
